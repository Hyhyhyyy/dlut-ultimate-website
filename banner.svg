<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="BLACK ANTS">
  <defs>
    <linearGradient id="bg_dlut" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0.00" stop-color="#052e16"/><stop offset="0.33" stop-color="#064e3b"/><stop offset="0.67" stop-color="#166534"/><stop offset="1.00" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="g_dlut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecfccb"/>
      <stop offset="0.5" stop-color="#bef264"/>
      <stop offset="1" stop-color="#fdba74"/>
      <animate attributeName="x1" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur_dlut" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip_dlut"><rect x="0" y="0" width="1280" height="380" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip_dlut)">
    <rect x="0" y="0" width="1280" height="380" fill="url(#bg_dlut)"/>
    <g filter="url(#blur_dlut)">
      
  <circle cx="180" cy="120" r="150" fill="#84cc16" opacity="0.30">
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 16.0; 0 0" dur="60s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="48.0s" begin="0.0s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="90" r="120" fill="#f97316" opacity="0.30">
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 -12.0; 0 0" dur="70s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="56.0s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="980" cy="300" r="170" fill="#fde047" opacity="0.30">
    <animateTransform attributeName="transform" type="translate" values="0 0; 50 20.0; 0 0" dur="55s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="44.0s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="320" cy="320" r="110" fill="#f97316" opacity="0.30">
    <animateTransform attributeName="transform" type="translate" values="0 0; -25 -10.0; 0 0" dur="65s" begin="2.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="52.0s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
    </g>
    
  <g opacity="0.12">
    <rect x="-300" y="150" width="300" height="3" fill="#bef264" transform="rotate(-18 0 150)">
      <animateTransform attributeName="transform" type="translate" values="-200 0; 1700 0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="-300" y="250" width="220" height="2" fill="#bef264" transform="rotate(-18 0 250)">
      <animateTransform attributeName="transform" type="translate" values="-200 0; 1700 0" dur="13s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
    
  <circle cx="320" cy="190" r="150" fill="none" stroke="#bef264" stroke-width="1.2" opacity="0.18" stroke-dasharray="6 14">
    <animateTransform attributeName="transform" type="rotate" from="0 320 190" to="360 320 190" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="190" r="110" fill="none" stroke="#bef264" stroke-width="1" opacity="0.12"/>
    <g transform="translate(1050,190)">
    <g>
      <ellipse cx="0" cy="0" rx="78" ry="30" fill="none" stroke="#bef264" stroke-width="10" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="78" ry="30" fill="none" stroke="#fb923c" stroke-width="3" opacity="0.7"/>
      <animateTransform attributeName="transform" type="rotate" from="-12 0 0" to="12 0 0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </g>
    <g stroke="#fb923c" stroke-width="3" opacity="0.6" stroke-linecap="round">
      <line x1="-110" y1="-40" x2="-150" y2="-55"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2s" repeatCount="indefinite"/></line>
      <line x1="110" y1="40" x2="150" y2="55"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/></line>
    </g>
  </g>
    
  <line x1="80" y1="250" x2="440" y2="250" stroke="url(#g_dlut)" stroke-width="4" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" values="360;0;0" keyTimes="0;0.55;1" dur="1.8s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="1.8s" fill="freeze"/>
  </line>
    
  <text x="80" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#g_dlut)" letter-spacing="-1">
    <animateTransform attributeName="transform" type="translate" values="-40 12; 0 0; 0 0" keyTimes="0;0.5;1" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1"/>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="1.6s" fill="freeze"/>
    BLACK ANTS
  </text>
  <text x="82" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#dcfce7">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.8s" fill="freeze"/>
    大连理工黑蚁极限飞盘队 · 官方网站
  </text>
    <text x="1240" y="356" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#dcfce7" opacity="0.55">made with &#10084; by Hyhyhyyy</text>
  </g>
</svg>